[package]
name = "wl-menu"
version = "0.1.1"
edition = "2021"
description = "Wayland layer-shell hierarchical menu daemon"

[[bin]]
name = "wl-menu"
path = "src/main.rs"

[dependencies]
calloop = "0.14"
calloop-wayland-source = "0.4"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
libc = "0.2"
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny-skia = "0.12"
toml = "1"
resvg = "0.48"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.9"
